[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surname-origin-classifier-rnn"
version = "1.0.0"
description = "Character-level RNN that predicts a surname's language of origin; PyTorch, TorchScript and Streamlit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["rnn", "nlp", "pytorch", "torchscript", "streamlit", "character-level"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4", "numpy>=1.26", "streamlit>=1.44"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/kishorhange111/surname-origin-classifier-rnn"

[tool.setuptools.packages.find]
include = ["surname_classifier*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["surname_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:`torch.jit.*:FutureWarning"]
